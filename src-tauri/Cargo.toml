[package]
name = "shadow-spider-desktop"
version = "12.0.0"
description = "Araneae desktop companion"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder", "NSScreen", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSLocale", "NSArray", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Keep build-time macro dylibs compatible with the installed macOS linker.
[profile.release.build-override]
debug = true
strip = false
