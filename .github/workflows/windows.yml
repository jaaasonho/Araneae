name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-support]
    paths:
      - 'src-tauri/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check JavaScript
        run: npm run check
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test desktop coordinates, clock and cropping
        run: node --test scripts/check-desktop-routing.mjs scripts/check-desktop-clock.mjs scripts/check-desktop-viewport.mjs
      - name: Test native integration and click recognition
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.1 --locked
      - name: Build Windows installer
        run: npm run desktop:build:windows
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Araneae-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
