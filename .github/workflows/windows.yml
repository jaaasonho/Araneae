name: Windows CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/windows.yml'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check JavaScript
        run: npm run check
      - name: Test release publishing
        run: node --test scripts/check-publish-release.mjs
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test desktop coordinates, clock and cropping
        run: node --test scripts/check-desktop-routing.mjs scripts/check-desktop-clock.mjs scripts/check-desktop-viewport.mjs
      - name: Check native compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Test native geometry and settings
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
